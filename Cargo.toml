[package]
name = "weapon-animation-hotreload"
version = "0.3.0-experimental.3"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
eldenring = { git = "https://github.com/vswarte/fromsoftware-rs.git", rev = "902851865d05069eda7dcfd6385c8881eadf29bf" }
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs.git", rev = "902851865d05069eda7dcfd6385c8881eadf29bf", package = "fromsoftware-shared" }
pelite = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[lib]
name = "CapacityExpansion"
path = "src/capacity/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
from-singleton = "3.0"
sha2 = "0.10"
